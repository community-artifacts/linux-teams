name: Release

# Push a v* tag: a draft release is created, the AppImage is built and attached to it,
# and only then is the release published. A failed build leaves the release as a draft.
# Manual runs only upload the AppImage as a build artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  FIREFOXPWA_VERSION: 2.20.1
  APPIMAGE_EXTRACT_AND_RUN: "1"
  IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Create draft release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "release $tag already exists, reusing it"
            exit 0
          fi
          # Notes come from the matching CHANGELOG.md section, else from the commit log.
          awk -v v="${tag#v}" '
            $0 ~ "^## \\[" v "\\]" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ -s notes.md ]; then
            gh release create "$tag" --draft --title "$tag" --notes-file notes.md
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes
          fi

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl wget file patchelf zenity libfuse2 \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install firefoxpwa
        run: |
          curl -fsSL -o firefoxpwa.deb \
            "https://github.com/filips123/PWAsForFirefox/releases/download/v${FIREFOXPWA_VERSION}/firefoxpwa_${FIREFOXPWA_VERSION}_amd64.deb"
          sudo apt-get install -y ./firefoxpwa.deb
          firefoxpwa runtime install
          test -d "$HOME/.local/share/firefoxpwa/runtime"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version "^2" --locked

      - name: Build AppImage
        run: ./scripts/build-appimage.sh

      - name: Checksum
        run: |
          cd dist
          sha256sum Teams_for_Linux-x86_64.AppImage > Teams_for_Linux-x86_64.AppImage.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/Teams_for_Linux-x86_64.AppImage*

      - name: Attach files to the draft release
        if: env.IS_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" \
            dist/Teams_for_Linux-x86_64.AppImage dist/Teams_for_Linux-x86_64.AppImage.sha256 --clobber

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Refuse to publish unless both files are attached.
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$assets" | grep -qx 'Teams_for_Linux-x86_64.AppImage' || { echo "AppImage missing"; exit 1; }
          echo "$assets" | grep -qx 'Teams_for_Linux-x86_64.AppImage.sha256' || { echo "checksum missing"; exit 1; }
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
